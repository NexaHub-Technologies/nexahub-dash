# Local database and inbox. Sign-in itself needs Neon Auth, so the app runs
# against a Neon dev branch; this is for migrations, pgTAP and the worker.
services:
  db:
    build:
      context: docker
      dockerfile: postgres.Dockerfile
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexahub
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - ./db:/db:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nexahub"]
      interval: 1s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:54324:8025"
      - "127.0.0.1:54325:1025"
